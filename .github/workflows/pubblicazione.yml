# Pubblicazione automatica LIPPOLIS PT
#
# - Pull request verso main: test + controllo delle migration (senza applicarle)
#   + anteprima del sito su un indirizzo temporaneo di Firebase.
# - Merge/push su main: test -> migration database -> funzioni Supabase -> sito live.
#
# Secrets richiesti (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN              token personale Supabase
#   SUPABASE_DB_PASSWORD               password del database del progetto
#   FIREBASE_SERVICE_ACCOUNT_LIPPOLISPT  chiave JSON dell'account di servizio Firebase

name: Pubblicazione

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: aftvzsrbowpwvvbgvzta
  FIREBASE_PROJECT_ID: lippolispt
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  controllo-database:
    name: Controllo migration (non applica nulla)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets presenti?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Mancano i secrets SUPABASE_ACCESS_TOKEN e/o SUPABASE_DB_PASSWORD"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migration nel repo e nel database
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Cosa verrebbe applicato
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

  anteprima:
    name: Anteprima sito
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:bia-ocr
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIPPOLISPT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d

  pubblica:
    name: Pubblica (database, funzioni, sito)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pubblicazione-produzione
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Applica le migration nuove
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Pubblica le funzioni
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - run: npm run build:bia-ocr
      - name: Pubblica il sito
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIPPOLISPT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
