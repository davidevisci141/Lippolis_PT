name: Lippolis Cam APK

on:
  push:
    branches: [lippolis-cam]
    paths-ignore: ['apk/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Modello profondita' (MiDaS small)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/depth.tflite \
            https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite
      - name: Compila
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: LIPPOLIS-CAM
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Salva l'APK nel branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/LIPPOLIS-CAM.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q --ignore-unmatch apk/ERRORE.log
          git add apk/LIPPOLIS-CAM.apk
          git commit -m "APK compilato [skip ci]"
          git push
      - name: Salva il log in caso di errore
        if: failure()
        run: |
          mkdir -p apk
          tail -c 60000 build.log > apk/ERRORE.log || echo "nessun log" > apk/ERRORE.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/ERRORE.log
          git commit -m "Log errore [skip ci]"
          git push
